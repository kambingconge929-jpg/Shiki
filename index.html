<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHIKI MODS | V1.0 FINAL</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --primary: #bc13fe; --bg: #0a0510; --card: rgba(25, 10, 40, 0.95); --text: #f0e6ff; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Poppins', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; background: radial-gradient(circle at center, #2e0044 0%, #0a0510 100%); padding: 40px 10px; min-height: 100vh; overflow-x: hidden; }
        
        .container, .section { background: var(--card); backdrop-filter: blur(15px); border-radius: 20px; border: 1px solid var(--primary); width: 95%; max-width: 420px; padding: 25px; text-align: center; margin-bottom: 20px; box-sizing: border-box; box-shadow: 0 0 25px rgba(188, 19, 254, 0.3); }
        .profile-img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--primary); box-shadow: 0 0 15px var(--primary); margin-bottom: 15px; object-fit: cover; }
        h1 { color: var(--primary); text-shadow: 0 0 10px var(--primary); margin: 0; font-size: 24px; letter-spacing: 2px; }
        
        .links { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .btn { background: rgba(188, 19, 254, 0.1); color: white; padding: 12px; text-decoration: none; border-radius: 10px; border: 1px solid var(--primary); font-weight: bold; transition: 0.3s; font-size: 13px; cursor: pointer; display: block; width: 100%; box-sizing: border-box; text-align: center; }
        .btn:hover { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary); transform: scale(1.02); }
        
        .cmd-box { background: #000; border: 1px solid #444; border-radius: 8px; padding: 10px; text-align: left; font-family: 'Courier New', monospace; font-size: 11px; color: #00ff00; height: 80px; overflow-y: auto; margin: 15px 0; border-left: 3px solid var(--primary); }
        textarea, input { width: 100%; background: #111; border: 1px solid var(--primary); border-radius: 8px; padding: 10px; color: #fff; font-size: 12px; margin-bottom: 10px; box-sizing: border-box; }

        /* FULLSCREEN MODAL UI */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(15px); z-index: 999; flex-direction: column; align-items: center; padding-top: 50px; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; width: 95%; max-width: 420px; margin-bottom: 25px; }
        .close-btn { background: var(--primary); color: #000; border: none; padding: 8px 15px; border-radius: 8px; font-weight: 900; cursor: pointer; }

        #project-grid { width: 95%; max-width: 420px; display: flex; flex-direction: column; gap: 15px; }
        .shiki-card { background: rgba(188, 19, 254, 0.1); border: 1px solid var(--primary); border-radius: 20px; padding: 20px; text-align: left; position: relative; }
        .badge-shiki { background: rgba(188, 19, 254, 0.2); color: var(--primary); padding: 5px 12px; border-radius: 20px; font-size: 10px; font-weight: bold; border: 1px solid var(--primary); margin-bottom: 10px; display: inline-block; }
        .card-name { font-size: 18px; font-weight: 900; color: #fff; margin-bottom: 5px; }
        .author-name { color: var(--primary); font-size: 12px; font-weight: bold; }
        .btn-dl-shiki { background: var(--primary); color: #000; padding: 8px 18px; border-radius: 8px; text-decoration: none; font-size: 11px; font-weight: bold; float: right; margin-top: -15px; }

        .store-trigger { width: 95%; max-width: 420px; background: var(--primary); color: #000; font-weight: 900; padding: 15px; border-radius: 12px; margin-bottom: 20px; cursor: pointer; border: none; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://cdn.discordapp.com/attachments/1403306022361235466/1501407305051275285/file_00000000bd78720bb6afdf59771ac3c3.png?ex=69fbf604&is=69faa484&hm=1117233214580a7992f48e3edbb75da66b08f6dcc3a3e8408ed64775d30bb169&" class="profile-img">
        <h1>SHIKI MODS</h1>
        <div class="cmd-box" id="cmdOut">> System Shiki V13.3 Final...</div>
        <div class="links">
            <a href="https://wa.me/6281315151701" class="btn">💬 WhatsApp Personal</a>
            <a href="https://whatsapp.com/channel/0029Vb730uH8kyyTsZ7aO826" class="btn">📢 Saluran Shiki</a>
            <a href="https://youtube.com/@mlanz04?si=FHUJ1THdTdPX0lUU" class="btn">📺 YouTube Official</a>
        </div>
    </div>

    <button class="store-trigger" onclick="openStore()">📁 KUMPULAN MONETLOADER SHIKI</button>

    <div id="storeModal" class="modal-overlay">
        <div class="modal-header">
            <div style="font-weight: 900; color: var(--primary); font-size: 18px;">👑 SHIKI STORE</div>
            <button class="close-btn" onclick="closeStore()">X CLOSE</button>
        </div>
        <div id="project-grid"></div>
    </div>

    <div class="section">
        <div style="color:var(--primary); font-weight:bold; margin-bottom:15px;">🔒 STABLE LUA OBFUSCATOR</div>
        <input type="file" id="obfFile" accept=".lua">
        <textarea id="obfInput" rows="3" placeholder="Input kode Lua..."></textarea>
        <button class="btn" onclick="obfuscateCode()" style="background:var(--primary); color:#000;">ENCRYPT & DOWNLOAD</button>
    </div>

    <div class="section" style="border-style: dashed;">
        <div style="color:var(--primary); font-weight:bold; margin-bottom:15px;">📤 UPLOAD KE STORE</div>
        <input type="text" id="scriptName" placeholder="Nama Script...">
        <input type="file" id="fileInput" accept=".lua">
        <button class="btn" onclick="uploadFile()" style="background:var(--primary); color:#000;">🚀 UPLOAD SEKARANG</button>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://shikimods-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref("scripts");

        function logCMD(msg) {
            const out = document.getElementById("cmdOut");
            out.innerHTML += `<br>> ${msg}`;
            out.scrollTop = out.scrollHeight;
        }

        // MODAL FUNCTIONS
        function openStore() {
            document.getElementById("storeModal").style.display = "flex";
            document.body.style.overflow = "hidden";
            logCMD("Opening Shiki Store UI...");
        }
        function closeStore() {
            document.getElementById("storeModal").style.display = "none";
            document.body.style.overflow = "auto";
        }

        // STABLE OBFUSCATOR ENGINE
        document.getElementById('obfFile').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function(e) { document.getElementById('obfInput').value = e.target.result; };
            reader.readAsText(e.target.files[0]);
        });

        function obfuscateCode() {
            const input = document.getElementById("obfInput").value;
            if(!input) return alert("Puki ayam, isi kodenya!");
            logCMD("Encrypting: Stable Shiki Mode...");
            let codes = [];
            for (let i = 0; i < input.length; i++) { codes.push(input.charCodeAt(i)); }
            const result = `-- [[ PROTECTED BY SHIKI MODS ]] --\nlocal _ = assert(load(string.char(${codes.join(',')})));\nif _ then pcall(_); end`;
            const blob = new Blob([result], {type: 'text/plain'});
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = "Shiki_Final.lua"; a.click();
            logCMD("Encryption Complete & Safe.");
        }

        function uploadFile() {
            const name = document.getElementById("scriptName").value;
            const file = document.getElementById("fileInput").files[0];
            if(!name || !file) return alert("Data gak lengkap!");
            const reader = new FileReader();
            reader.onload = function(e) {
                db.push().set({ name: name, code: e.target.result, date: new Date().toLocaleDateString() });
                alert("Upload Berhasil!");
            };
            reader.readAsText(file);
        }

        // RENDER CARDS TO MODAL
        db.on("value", (snap) => {
            const grid = document.getElementById("project-grid");
            grid.innerHTML = "";
            snap.forEach((child) => {
                const data = child.val();
                const card = document.createElement("div");
                card.className = "shiki-card";
                card.innerHTML = `
                    <div class="badge-shiki">💎 SHIKI EXCLUSIVE</div>
                    <a href="data:text/plain;charset=utf-8,${encodeURIComponent(data.code)}" download="${data.name}.lua" class="btn-dl-shiki">DL</a>
                    <div class="card-name">${data.name}</div>
                    <div class="author-name">👑 AUTHOR: SHIKI | ${data.date}</div>
                `;
                grid.prepend(card);
            });
        });
    </script>
</body>
</html>
