<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHIKII MARKET V35.0</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00d2ff; --accent: #9d50bb; --bg: #0b0e11; --card-bg: rgba(25, 30, 36, 0.9); --gold: #f1c40f; }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: #e1e1e1; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
        
        .header { text-align: center; padding: 30px 20px; }
        .header h1 { font-family: 'Orbitron', sans-serif; font-size: 28px; color: #fff; text-shadow: 0 0 15px var(--primary); margin: 0; }
        .header p { font-size: 10px; color: var(--primary); text-transform: uppercase; letter-spacing: 3px; }

        .nav-tabs { display: flex; overflow-x: auto; gap: 10px; padding: 10px; width: 95%; max-width: 500px; scrollbar-width: none; }
        .tab { white-space: nowrap; padding: 10px 20px; background: var(--card-bg); border-radius: 12px; border: 1px solid #2c3e50; font-size: 11px; font-weight: 600; cursor: pointer; }
        .tab.active { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; border: none; box-shadow: 0 5px 15px rgba(0, 210, 255, 0.3); }

        .container { width: 100%; max-width: 450px; display: none; padding: 15px; animation: fadeIn 0.4s ease; }
        .container.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* GRID CARDS WITH OVERLAY TEXT */
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .item-card { background: var(--card-bg); border-radius: 18px; border: 1px solid #222; overflow: hidden; position: relative; }
        
        .img-wrapper { position: relative; width: 100%; height: 120px; }
        .preview-img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.7); }
        
        /* TEXT DI ATAS FOTO (MANUAL TEXT) */
        .img-label { position: absolute; bottom: 8px; left: 8px; background: rgba(0, 210, 255, 0.8); color: #000; font-size: 9px; font-weight: 900; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; max-width: 80%; }

        .card-info { padding: 12px; }
        .item-name { font-weight: 600; font-size: 13px; color: #fff; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .item-price { font-size: 12px; color: var(--gold); font-weight: 700; }
        
        .btn-buy { margin-top: 10px; display: block; width: 100%; padding: 8px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid #333; color: #fff; text-decoration: none; font-size: 10px; text-align: center; font-weight: 600; }
        
        /* ADMIN FORM */
        .form-box { background: var(--card-bg); padding: 20px; border-radius: 20px; border: 1px solid #222; }
        input, textarea { width: 100%; background: #000; border: 1px solid #333; border-radius: 10px; padding: 12px; color: #fff; margin-bottom: 10px; font-family: 'Poppins'; }
        .btn-main { width: 100%; padding: 15px; border-radius: 12px; border: none; background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h1>SHIKII MARKET</h1>
        <p>Preview Text Edition</p>
    </div>

    <div class="nav-tabs">
        <div class="tab active" onclick="switchTab('free', this)">FREE MODS</div>
        <div class="tab" onclick="switchTab('premium', this)">PREMIUM</div>
        <div class="tab" onclick="switchTab('obfus', this)">OBFUSCATOR</div>
        <div class="tab" onclick="switchTab('admin', this)">ADMIN</div>
    </div>

    <div id="free" class="container active"><div id="list-free" class="grid-container"></div></div>
    <div id="premium" class="container"><div id="list-premium" class="grid-container"></div></div>

    <div id="obfus" class="container">
        <div class="form-box">
            <h3 style="margin:0;">LUA ENCRYPTOR</h3>
            <textarea id="luaInput" rows="6" placeholder="Paste script..."></textarea>
            <button class="btn-main" onclick="processObfus()">PROTECT & DOWNLOAD</button>
        </div>
    </div>

    <div id="admin" class="container">
        <div class="form-box">
            <h3>UPLOAD NEW MOD</h3>
            <input type="text" id="name" placeholder="Nama File (Contoh: VIP Mod)">
            <input type="text" id="label" placeholder="Text di Foto (Contoh: ROBERY VIP)">
            <input type="text" id="price" placeholder="Harga (FREE/20k)">
            <input type="file" id="img" accept="image/*">
            <input type="text" id="url" placeholder="Link Download">
            <button class="btn-main" onclick="uploadMod()">🚀 PUBLISH SEKARANG</button>
        </div>
    </div>

    <script>
        const config = {
            apiKey: "AIzaSyBrcjH0HfMDAsjaFZkXodZJtEXegbD1R9w",
            authDomain: "shiki-mods.firebaseapp.com",
            projectId: "shiki-mods",
            databaseURL: "https://shiki-mods-default-rtdb.asia-southeast1.firebasedatabase.app",
            storageBucket: "shiki-mods.firebasestorage.app",
            appId: "1:407754298344:web:002f0c7033e59f9f9a0a5d"
        };
        firebase.initializeApp(config);
        const db = firebase.database().ref("shiki_market_links");
        const storage = firebase.storage().ref();

        function switchTab(id, el) {
            if (id === 'admin' && prompt("PASS:") !== "hamlanmaulana") return;
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        }

        db.on("value", (snap) => {
            const f = document.getElementById("list-free");
            const p = document.getElementById("list-premium");
            f.innerHTML = ""; p.innerHTML = "";
            snap.forEach(c => {
                const i = c.val();
                const isFree = i.price.toLowerCase().includes("free");
                const card = `
                    <div class="item-card">
                        <div class="img-wrapper">
                            <img src="${i.img || 'https://via.placeholder.com/150'}" class="preview-img">
                            ${i.label ? `<div class="img-label">${i.label}</div>` : ''}
                        </div>
                        <div class="card-info">
                            <div class="item-name">${i.name}</div>
                            <div class="item-price">${i.price}</div>
                            <a href="${isFree ? i.url : 'https://wa.me/6281315151701?text=BANG%20SHIKI%20GUA%20MAU%20BUY%20'+encodeURIComponent(i.name)}" class="btn-buy">${isFree ? 'DOWNLOAD' : 'BUY NOW'}</a>
                        </div>
                    </div>`;
                if(isFree) f.innerHTML += card; else p.innerHTML += card;
            });
        });

        async function uploadMod() {
            const name = document.getElementById("name").value;
            const label = document.getElementById("label").value;
            const price = document.getElementById("price").value;
            const file = document.getElementById("img").files[0];
            const url = document.getElementById("url").value;
            
            if(!name || !file) return alert("Isi minimal Nama & Foto!");
            
            alert("Sedang Upload... Tunggu bentar puki!");
            const s = await storage.child('p/'+Date.now()).put(file);
            const imgUrl = await s.ref.getDownloadURL();
            
            await db.push().set({
                name: name,
                label: label, // Ini text manualnya
                price: price,
                img: imgUrl,
                url: url
            });
            location.reload();
        }
    </script>
</body>
</html>
