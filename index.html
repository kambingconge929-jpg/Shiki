<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHIKI MARKET V32.0</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00ff88; --bg: #050208; --card: rgba(15, 15, 25, 0.95); --gold: #ffd700; }
        body { background: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .header h1 { font-family: 'Orbitron', sans-serif; font-size: 24px; color: var(--primary); text-shadow: 0 0 10px var(--primary); margin: 20px 0; }
        .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; width: 100%; max-width: 400px; }
        .tab { flex: 1; padding: 12px 5px; text-align: center; background: #111; border-radius: 8px; cursor: pointer; border: 1px solid #333; font-weight: bold; font-size: 11px; color: #aaa; }
        .tab.active { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary); border-color: var(--primary); }
        .container { width: 100%; max-width: 400px; display: none; }
        .container.active { display: block !important; }
        .item-card { background: var(--card); border-radius: 15px; overflow: hidden; margin-bottom: 15px; border: 1px solid #222; }
        .preview-img { width: 100%; height: 180px; object-fit: cover; border-bottom: 2px solid var(--primary); }
        .card-body { padding: 15px; }
        .price { color: var(--gold); font-weight: 900; font-size: 18px; margin: 5px 0; }
        .btn { display: block; width: 100%; padding: 12px; text-align: center; border-radius: 8px; text-decoration: none; font-weight: 900; margin-top: 10px; cursor: pointer; border: none; font-size: 13px; }
        .btn-go { background: var(--primary); color: #000; }
        .form-box { background: var(--card); padding: 15px; border-radius: 15px; border: 1px dashed var(--primary); }
        input { width: 100%; padding: 10px; margin-bottom: 12px; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; box-sizing: border-box; }
        label { font-size: 11px; color: var(--primary); font-weight: bold; }
    </style>
</head>
<body>

    <div class="header"><h1>SHIKI MODS</h1></div>

    <div class="nav-tabs">
        <div id="t-store" class="tab active" onclick="switchTab('store', this)">🛒 MONETLOADER</div>
        <div id="t-social" class="tab" onclick="switchTab('social', this)">📱 SALURAN</div>
        <div id="t-admin" class="tab" onclick="switchTab('admin', this)">🛠️ ADMIN ONLY</div>
    </div>

    <div id="store" class="container active">
        <div id="list"></div>
    </div>

    <div id="social" class="container">
        <div class="form-box" style="text-align: center;">
            <h3 style="color:var(--primary);">MY SOCIAL MEDIA</h3>
            <a href="https://youtube.com/@shikimods" target="_blank" class="btn btn-go" style="background:#ff0000; color:#fff;">📺 YOUTUBE</a>
            <a href="https://whatsapp.com/channel/0029Vb730uH8kyyTsZ7aO826" target="_blank" class="btn btn-go" style="background:#25d366; color:#fff;">📢 SALURAN WA</a>
        </div>
    </div>

    <div id="admin" class="container">
        <div class="form-box">
            <h3 style="color:var(--primary);">➕ UPLOAD MOD</h3>
            <label>Nama Mod:</label>
            <input type="text" id="name" placeholder="Nama mod">
            <label>Harga (Nominal/FREE):</label>
            <input type="text" id="price" placeholder="Harga">
            <label>Foto Preview:</label>
            <input type="file" id="imageFile" accept="image/*">
            <button class="btn btn-go" onclick="startUpload()">🚀 PUBLISH</button>
            <div id="up-status" style="text-align:center; font-size:10px; margin-top:10px;"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBrcjH0HfMDAsjaFZkXodZJtEXegbD1R9w",
            authDomain: "shiki-mods.firebaseapp.com",
            projectId: "shiki-mods",
            databaseURL: "https://shiki-mods-default-rtdb.asia-southeast1.firebasedatabase.app",
            storageBucket: "shiki-mods.firebasestorage.app",
            appId: "1:407754298344:web:002f0c7033e59f9f9a0a5d"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref("shiki_market_links");
        const storage = firebase.storage().ref();

        function switchTab(id, el) {
            if (id === 'admin') {
                if (prompt("PASS:") !== "hamlanmaulana") return;
            }
            // Sembunyikan SEMUA container
            document.querySelectorAll('.container').forEach(c => c.style.display = 'none');
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            
            // Tampilkan yang dipilih
            document.getElementById(id).style.display = 'block';
            el.classList.add('active');
        }

        async function startUpload() {
            const name = document.getElementById("name").value;
            const price = document.getElementById("price").value;
            const imgFile = document.getElementById("imageFile").files[0];
            const status = document.getElementById("up-status");
            if(!name || !price || !imgFile) return alert("Lengkapi data!");

            status.innerText = "⏳ Uploading...";
            try {
                const imgRef = storage.child('previews/' + Date.now() + "_" + imgFile.name);
                const snap = await imgRef.put(imgFile);
                const url = await snap.ref.getDownloadURL();
                await db.push().set({ name, price, img: url, time: Date.now() });
                alert("Berhasil!"); location.reload();
            } catch (e) { alert(e.message); status.innerText = ""; }
        }

        db.on("value", (snap) => {
            const l = document.getElementById("list");
            l.innerHTML = "";
            if(!snap.exists()) return l.innerHTML = "<p style='text-align:center;'>Market Kosong...</p>";
            snap.forEach((child) => {
                const i = child.val();
                l.innerHTML = `
                <div class="item-card">
                    <img src="${i.img}" class="preview-img">
                    <div class="card-body">
                        <div style="font-weight:900;">${i.name}</div>
                        <div class="price">${i.price}</div>
                        <a href="https://wa.me/6281315151701" target="_blank" class="btn btn-go">BELI SEKARANG</a>
                    </div>
                </div>` + l.innerHTML;
            });
        });
    </script>
</body>
</html>
