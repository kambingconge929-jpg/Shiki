<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHIKI MODS | Cloud Store</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --primary: #00ff88; --bg: #050505; --card: rgba(20, 20, 20, 0.9); --text: #ffffff; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Poppins', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; background: radial-gradient(circle at center, #004422 0%, #050505 100%); padding: 40px 10px; }
        .container, .form-section { background: var(--card); backdrop-filter: blur(10px); border-radius: 25px; border: 1px solid rgba(0, 255, 136, 0.3); width: 90%; max-width: 400px; padding: 30px 20px; text-align: center; margin-bottom: 25px; box-sizing: border-box; }
        .profile-img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--primary); box-shadow: 0 0 15px var(--primary); margin-bottom: 15px; }
        h1 { color: var(--primary); text-shadow: 0 0 10px var(--primary); margin: 0; }
        .links { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .btn { background: rgba(255,255,255,0.05); color: white; padding: 12px; text-decoration: none; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); font-weight: bold; transition: 0.3s; }
        .btn:hover { background: var(--primary); color: #000; }
        
        /* Dashboard Card */
        .dashboard-title { width: 90%; max-width: 400px; text-align: left; color: var(--primary); font-weight: bold; margin-bottom: 15px; border-left: 4px solid var(--primary); padding-left: 10px; }
        #project-grid { width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--card); border-radius: 20px; border: 1px solid #333; overflow: hidden; text-align: left; animation: fadeIn 0.5s; }
        .card-content { padding: 15px; }
        .card-title { font-size: 18px; font-weight: bold; color: var(--primary); }
        .btn-dl { background: var(--primary); color: #000; padding: 10px; border-radius: 10px; text-decoration: none; display: block; text-align: center; margin-top: 10px; font-weight: bold; font-size: 14px; }
        
        /* Form */
        input, textarea { width: 100%; background: #111; border: 1px solid #333; border-radius: 10px; padding: 12px; color: white; margin-bottom: 10px; box-sizing: border-box; }
        .btn-submit { background: var(--primary); color: #000; width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://cdn.discordapp.com/attachments/1403306022361235466/1501407305051275285/file_00000000bd78720bb6afdf59771ac3c3.png?ex=69fbf604&is=69faa484&hm=1117233214580a7992f48e3edbb75da66b08f6dcc3a3e8408ed64775d30bb169&" class="profile-img">
        <h1>SHIKI MODS</h1>
        <p style="font-size:12px; color:#aaa;">Verified Developer | Android Modder</p>
        <div class="links">
            <a href="https://wa.me/6281315151701" class="btn">💬 WhatsApp Me</a>
        </div>
    </div>

    <div class="dashboard-title">Project Dashboard</div>
    <div id="project-grid">
        </div>

    <div class="form-section">
        <div style="color:var(--primary); font-weight:bold; margin-bottom:15px;">Upload New Script</div>
        <input type="text" id="scriptName" placeholder="Nama Script (Contoh: Auto Fish)">
        <textarea id="scriptCode" rows="4" placeholder="Tempel Kode Lua Lu Di Sini..."></textarea>
        <button class="btn-submit" onclick="uploadScript()">🚀 Submit to Dashboard</button>
    </div>

    <script>
        // KONFIGURASI FIREBASE (OTAK DATABASE)
        const firebaseConfig = { databaseURL: "https://shikimods-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref("scripts");

        // FUNGSI UPLOAD
        function uploadScript() {
            const name = document.getElementById("scriptName").value;
            const code = document.getElementById("scriptCode").value;
            if(name && code) {
                db.push().set({ name: name, code: code, date: new Date().toLocaleDateString() });
                document.getElementById("scriptName").value = "";
                document.getElementById("scriptCode").value = "";
                alert("SADIS! Script lu udah live di dashboard, asu!");
            } else { alert("Isi dulu puki ayam!"); }
        }

        // FUNGSI BACA DATA (BIAR MUNCUL OTOMATIS)
        db.on("value", (snapshot) => {
            const grid = document.getElementById("project-grid");
            grid.innerHTML = "";
            snapshot.forEach((child) => {
                const data = child.val();
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <div class="card-content">
                        <div class="card-title">${data.name}</div>
                        <div style="font-size:10px; color:#666;">Uploaded: ${data.date}</div>
                        <a href="data:text/plain;charset=utf-8,${encodeURIComponent(data.code)}" download="${data.name}.lua" class="btn-dl">⬇️ Download .lua</a>
                    </div>
                `;
                grid.prepend(card);
            });
        });
    </script>
</body>
</html>
