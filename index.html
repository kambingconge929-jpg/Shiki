<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHIKI MARKET V29.0</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00ff88; --bg: #050208; --card: rgba(15, 15, 25, 0.95); --gold: #ffd700; --yt: #ff0000; --wa: #25d366; }
        body { background: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header h1 { font-family: 'Orbitron', sans-serif; font-size: 24px; color: var(--primary); text-shadow: 0 0 10px var(--primary); margin: 15px 0; }
        .nav-tabs { display: flex; gap: 5px; margin-bottom: 20px; width: 100%; max-width: 400px; }
        .tab { flex: 1; padding: 12px 2px; text-align: center; background: var(--card); border-radius: 8px; cursor: pointer; border: 1px solid #333; font-weight: bold; font-size: 10px; }
        .tab.active { background: var(--primary); color: #000; box-shadow: 0 0 10px var(--primary); }
        .container { width: 100%; max-width: 400px; display: none; }
        .container.active { display: block; }
        .item-card { background: var(--card); border-radius: 15px; overflow: hidden; margin-bottom: 15px; border: 1px solid #222; }
        .preview-img { width: 100%; height: 180px; object-fit: cover; background: #111; border-bottom: 2px solid var(--primary); }
        .card-body { padding: 15px; }
        .price { color: var(--gold); font-weight: 900; font-size: 18px; margin: 5px 0; }
        .btn { display: block; width: 100%; padding: 12px; text-align: center; border-radius: 8px; text-decoration: none; font-weight: 900; margin-top: 10px; cursor: pointer; border: none; text-transform: uppercase; box-sizing: border-box; font-size: 13px; }
        .btn-go { background: var(--primary); color: #000; }
        .form-box { background: var(--card); padding: 15px; border-radius: 15px; border: 1px dashed var(--primary); }
        label { display: block; font-size: 11px; color: var(--primary); margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; margin-bottom: 12px; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; box-sizing: border-box; font-size: 12px; }
        #upload-status { font-size: 10px; color: var(--gold); text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="header"><h1>SHIKI MARKET</h1></div>

    <div class="nav-tabs">
        <div class="tab active" onclick="switchTab('store', this)">🛒 MONETLOADER</div>
        <div class="tab" onclick="switchTab('social', this)">📱 SALURAN</div>
        <div class="tab" onclick="switchTab('admin', this)">🛠️ ADMIN ONLY</div>
    </div>

    <div id="store" class="container active"><div id="list"></div></div>

    <div id="social" class="container">
        <div class="form-box" style="text-align: center;">
            <h3 style="color:var(--primary);">SOCIAL MEDIA</h3>
            <a href="http://googleusercontent.com/youtube.com/4" target="_blank" class="btn btn-go" style="background:#ff0000; color:#fff;">📺 YOUTUBE CHANNEL</a>
            <a href="https://whatsapp.com/channel/0029Vb730uH8kyyTsZ7aO826" target="_blank" class="btn btn-go" style="background:#25d366; color:#fff;">📢 SALURAN WA</a>
        </div>
    </div>

    <div id="admin" class="container">
        <div class="form-box">
            <h3 style="color:var(--primary); margin:0 0 10px 0;">➕ UPLOAD MOD</h3>
            <label>Nama Mod:</label>
            <input type="text" id="name" placeholder="Contoh: Mod No Grass">
            
            <label>Harga (Ketik FREE atau Nominal):</label>
            <input type="text" id="price" placeholder="Contoh: 20k / FREE">

            <label>Foto Preview (Bukti Monet):</label>
            <input type="file" id="imageFile" accept="image/*">

            <label>Link File (Opsional):</label>
            <input type="text" id="url" placeholder="Paste link kalau ada">
            
            <label>Atau Upload File Langsung:</label>
            <input type="file" id="modFile">

            <button class="btn btn-go" onclick="startUpload()">🚀 UPLOAD</button>
            <div id="upload-status"></div>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = "shiki123"; 
        const NOMOR_WA = "6281315151701"; 

        const firebaseConfig = {
            apiKey: "AIzaSyBrcjH0HfMDAsjaFZkXodZJtEXegbD1R9w",
            authDomain: "shiki-mods.firebaseapp.com",
            projectId: "shiki-mods",
            databaseURL: "https://shiki-mods-default-rtdb.asia-southeast1.firebasedatabase.app",
            storageBucket: "shiki-mods.appspot.com", // SESUAIKAN DENGAN CONSOLE LU
            appId: "1:407754298344:web:002f0c7033e59f9f9a0a5d"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref("shiki_market_links");
        const storage = firebase.storage().ref();

        function switchTab(id, el) {
            if (id === 'admin') {
                if (prompt("PASSWORD ADMIN:") !== ADMIN_PASSWORD) return alert("SALAH MEK!");
            }
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        }

        async function startUpload() {
            const name = document.getElementById("name").value;
            const price = document.getElementById("price").value;
            const imgFile = document.getElementById("imageFile").files[0];
            const modFile = document.getElementById("modFile").files[0];
            const manualUrl = document.getElementById("url").value;
            const status = document.getElementById("upload-status");

            if(!name || !price) return alert("Nama & Harga wajib isi!");

            status.innerText = "⏳ Sedang mengupload, sabar mek...";

            let finalImgUrl = "";
            let finalModUrl = manualUrl;

            try {
                // Upload Foto Preview
                if(imgFile) {
                    const imgRef = storage.child('previews/' + Date.now() + "_" + imgFile.name);
                    await imgRef.put(imgFile);
                    finalImgUrl = await imgRef.getDownloadURL();
                }

                // Upload File Mod (Kalau ada)
                if(modFile) {
                    const modRef = storage.child('files/' + Date.now() + "_" + modFile.name);
                    await modRef.put(modFile);
                    finalModUrl = await modRef.getDownloadURL();
                }

                db.push().set({
                    name: name,
                    price: price,
                    img: finalImgUrl,
                    url: finalModUrl,
                    time: Date.now()
                }).then(() => {
                    alert("Berhasil Terbit!");
                    location.reload();
                });

            } catch (e) {
                alert("Gagal Upload! Cek kuota storage lu.");
                status.innerText = "";
            }
        }

        db.on("value", (snap) => {
            const l = document.getElementById("list");
            l.innerHTML = ""; 
            if(!snap.exists()) return l.innerHTML = "<p style='text-align:center;'>Market Kosong...</p>";

            snap.forEach((child) => {
                const item = child.val();
                const hargaLower = item.price.toLowerCase();
                const isFree = (hargaLower === "free" || hargaLower === "0" || hargaLower === "gratis");
                
                const btnLink = isFree ? item.url : `https://wa.me/${NOMOR_WA}?text=${encodeURIComponent('Halo Bang, mau beli Mod: *'+item.name+'* seharga *'+item.price+'*')}`;
                const btnTeks = isFree ? "🔗 AMBIL MOD (FREE)" : "💳 BELI SEKARANG";

                l.innerHTML = `
                    <div class="item-card">
                        ${item.img ? `<img src="${item.img}" class="preview-img">` : ''}
                        <div class="card-body">
                            <div style="font-weight:900; font-size:18px;">${item.name}</div>
                            <div class="price">${item.price}</div>
                            <a href="${btnLink}" target="_blank" class="btn btn-go">${btnTeks}</a>
                        </div>
                    </div>` + l.innerHTML;
            });
        });
    </script>
</body>
</html>
