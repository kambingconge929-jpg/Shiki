<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHIKII MODS V40.0</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00d2ff; --accent: #9d50bb; --bg: #0b0e11; --card-bg: rgba(25, 30, 36, 0.95); --gold: #f1c40f; }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: #e1e1e1; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .header { text-align: center; padding: 25px 10px; }
        .header h1 { font-family: 'Orbitron', sans-serif; font-size: 26px; color: #fff; text-shadow: 0 0 10px var(--primary); margin: 0; }
        .header p { font-size: 10px; color: var(--primary); letter-spacing: 2px; }

        .nav-tabs { display: flex; overflow-x: auto; gap: 8px; padding: 10px; width: 100%; max-width: 500px; justify-content: center; scrollbar-width: none; }
        .tab { white-space: nowrap; padding: 8px 18px; background: #1a1f26; border-radius: 12px; border: 1px solid #333; font-size: 11px; font-weight: 600; cursor: pointer; color: #888; transition: 0.3s; }
        .tab.active { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; border: none; box-shadow: 0 4px 12px rgba(0, 210, 255, 0.3); }

        .container { width: 100%; max-width: 450px; display: none; padding: 15px; animation: fadeIn 0.3s ease; }
        .container.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .item-card { background: var(--card-bg); border-radius: 18px; border: 1px solid #222; overflow: hidden; position: relative; transition: 0.3s; }
        .img-wrapper { position: relative; width: 100%; height: 110px; background: #000; }
        .preview-img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.8); }
        .img-label { position: absolute; bottom: 6px; left: 6px; background: var(--primary); color: #000; font-size: 8px; font-weight: 900; padding: 3px 7px; border-radius: 4px; text-transform: uppercase; }

        .card-info { padding: 12px; }
        .item-name { font-weight: 600; font-size: 13px; color: #fff; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-price { font-size: 11px; color: var(--gold); font-weight: 700; }
        .btn-buy { margin-top: 10px; display: block; width: 100%; padding: 8px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid #444; color: #fff; text-decoration: none; font-size: 10px; text-align: center; font-weight: 600; }

        .form-box { background: var(--card-bg); padding: 20px; border-radius: 20px; border: 1px solid #333; }
        input, textarea { width: 100%; background: #050505; border: 1px solid #222; border-radius: 10px; padding: 12px; color: #fff; margin-bottom: 12px; font-size: 12px; }
        .btn-main { width: 100%; padding: 14px; border-radius: 12px; border: none; background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; font-weight: 700; cursor: pointer; text-transform: uppercase; font-size: 11px; }
        
        .file-label { display: block; background: #111; border: 1px dashed var(--primary); padding: 12px; text-align: center; border-radius: 10px; color: var(--primary); font-size: 11px; cursor: pointer; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>SHIKII MODS</h1>
        <p>MONETLOADER & MODPACK MARKET</p>
    </div>

    <div class="nav-tabs">
        <div class="tab active" onclick="switchTab('free', this)">FREE MODS</div>
        <div class="tab" onclick="switchTab('premium', this)">PREMIUM</div>
        <div class="tab" onclick="switchTab('obfus', this)">OBFUSCATOR</div>
        <div class="tab" onclick="switchTab('admin', this)">ADMIN</div>
    </div>

    <div id="free" class="container active"><div id="list-free" class="grid-container"></div></div>
    <div id="premium" class="container"><div id="list-premium" class="grid-container"></div></div>

    <div id="obfus" class="container">
        <div class="form-box">
            <h3 style="margin-top:0; font-size:16px; color:var(--primary);">🔐 LUA PROTECTOR</h3>
            <label class="file-label" for="luaFile">📂 UPLOAD FILE .LUA</label>
            <input type="file" id="luaFile" accept=".lua" style="display:none;" onchange="handleLuaUpload(this)">
            <textarea id="luaInput" rows="6" placeholder="Atau paste code di sini..."></textarea>
            <button class="btn-main" onclick="runObfus()">PROTECT SCRIPT</button>
            <button id="dlBtn" class="btn-main" style="display:none; margin-top:10px; background:var(--gold); color:#000;" onclick="downloadResult()">📥 DOWNLOAD HASIL</button>
        </div>
    </div>

    <div id="admin" class="container">
        <div class="form-box">
            <h3 style="margin-top:0; font-size:16px; color:var(--primary);">📤 UPLOAD CONTENT</h3>
            <input type="text" id="name" placeholder="Nama Mod">
            <input type="text" id="label" placeholder="Label di Foto (Contoh: ROBERY VIP)">
            <input type="text" id="price" placeholder="Harga (Contoh: FREE / 15k)">
            <input type="text" id="imgUrlInput" placeholder="Link Foto (Discord/Imgur)">
            <input type="text" id="url" placeholder="Link Download Mod">
            
            <button class="btn-main" onclick="uploadMod()">🚀 PUBLISH SEKARANG</button>
        </div>
    </div>

    <script>
        const config = {
            apiKey: "AIzaSyBrcjH0HfMDAsjaFZkXodZJtEXegbD1R9w",
            authDomain: "shiki-mods.firebaseapp.com",
            projectId: "shiki-mods",
            databaseURL: "https://shiki-mods-default-rtdb.asia-southeast1.firebasedatabase.app",
            appId: "1:407754298344:web:002f0c7033e59f9f9a0a5d"
        };
        firebase.initializeApp(config);
        const db = firebase.database().ref("shiki_market_links");

        function switchTab(id, el) {
            if (id === 'admin' && prompt("PASS ADMIN:") !== "hamlanmaulana") return;
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        }

        // --- MARKET SYNC ---
        db.on("value", (snap) => {
            const f = document.getElementById("list-free");
            const p = document.getElementById("list-premium");
            f.innerHTML = ""; p.innerHTML = "";
            snap.forEach(c => {
                const i = c.val();
                const isFree = i.price.toLowerCase().includes("free");
                const card = `
                    <div class="item-card">
                        <div class="img-wrapper">
                            <img src="${i.img || 'https://via.placeholder.com/150'}" class="preview-img">
                            ${i.label ? `<div class="img-label">${i.label}</div>` : ''}
                        </div>
                        <div class="card-info">
                            <div class="item-name">${i.name}</div>
                            <div class="item-price">${i.price}</div>
                            <a href="${isFree ? i.url : 'https://wa.me/6281315151701?text=BANG SHIKI GUA MAU BUY%20'+encodeURIComponent(i.name)}" target="_blank" class="btn-buy">${isFree ? 'DOWNLOAD' : 'BUY NOW'}</a>
                        </div>
                    </div>`;
                if(isFree) f.innerHTML += card; else p.innerHTML += card;
            });
        });

        // --- OBFUSCATOR ---
        let obResult = "";
        function handleLuaUpload(input) {
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = (e) => { document.getElementById("luaInput").value = e.target.result; };
            reader.readAsText(file);
        }
        function runObfus() {
            const input = document.getElementById("luaInput").value;
            if(!input) return alert("Isi script dulu!");
            const bytes = [];
            for (let i = 0; i < input.length; i++) { bytes.push(input.charCodeAt(i) + 13); }
            obResult = `--[ PROTECTED BY SHIKII ]--\nlocal _ = '${bytes.join(",")}'; load(function(s) local r = ''; for i in s:gmatch('%d+') do r = r .. string.char(tonumber(i)-13) end return r end(_))()`;
            document.getElementById("dlBtn").style.display = "block";
            alert("Berhasil di-protect!");
        }
        function downloadResult() {
            const blob = new Blob([obResult], {type: 'text/plain'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'shikii_mod.lua';
            a.click();
        }

        // --- ADMIN UPLOAD (LINK BASED) ---
        async function uploadMod() {
            const name = document.getElementById("name").value;
            const label = document.getElementById("label").value;
            const price = document.getElementById("price").value;
            const img = document.getElementById("imgUrlInput").value;
            const url = document.getElementById("url").value;

            if(!name || !img) return alert("Nama & Link Foto wajib diisi!");

            try {
                await db.push().set({ name, label, price, img, url });
                alert("✅ BERHASIL PUBLISH!");
                location.reload();
            } catch(e) { alert("Gagal: " + e.message); }
        }
    </script>
</body>
</html>
