<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daffvdm | Official Profile</title>
    <style>
        :root {
            --primary: #ff4d4d;
            --bg: #0a0a0a;
            --card: #151515;
            --text: #ffffff;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: var(--card);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 90%;
            max-width: 400px;
            border: 1px solid #333;
        }
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid var(--primary);
            margin-bottom: 15px;
        }
        h1 { margin: 10px 0; font-size: 24px; color: var(--primary); }
        p { color: #aaa; font-size: 14px; margin-bottom: 20px; }
        .links { display: flex; flex-direction: column; gap: 10px; }
        .btn {
            background: #222;
            color: white;
            padding: 12px;
            text-decoration: none;
            border-radius: 10px;
            transition: 0.3s;
            border: 1px solid #444;
            font-weight: bold;
        }
        .btn:hover {
            background: var(--primary);
            transform: translateY(-3px);
            border-color: var(--primary);
        }
        .footer { margin-top: 25px; font-size: 10px; color: #555; }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://via.placeholder.com/150" alt="P" class="profile-img">
        <h1>SHIKI MODS</h1>
        <p>Expert Script Developer | Android Modder<br>Anti-Plagiarism & Real Coder</p>
        
        <div class="links">
            <a href="#" class="btn">🚀 My Projects (GitHub)</a>
            <a href="#" class="btn">📱 WhatsApp Contact</a>
            <a href="#" class="btn">📹 YouTube Channel</a>
            <a href="#" class="btn">💾 Download My Scripts</a>
        </div>

        <div class="footer">
            © 2026 SHIKIMODS V1.0 - ALL RIGHTS RESERVED
        </div>
    </div>
</body>
</html>
