<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHIKII MODS V33.0</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00ff88; --bg: #050208; --card: rgba(15, 15, 25, 0.95); --gold: #ffd700; }
        body { background: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header h1 { font-family: 'Orbitron', sans-serif; font-size: 22px; color: var(--primary); text-shadow: 0 0 10px var(--primary); margin: 15px 0; }
        .nav-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 10px; width: 100%; max-width: 400px; }
        .tab { padding: 12px 2px; text-align: center; background: var(--card); border-radius: 8px; cursor: pointer; border: 1px solid #333; font-weight: bold; font-size: 10px; color: #fff; }
        .tab.active { background: var(--primary); color: #000; box-shadow: 0 0 10px var(--primary); border-color: var(--primary); }
        .container { width: 100%; max-width: 400px; display: none; }
        .container.active { display: block; }
        .item-card { background: var(--card); border-radius: 15px; overflow: hidden; margin-bottom: 15px; border: 1px solid #222; }
        .preview-img { width: 100%; height: 180px; object-fit: cover; background: #111; border-bottom: 2px solid var(--primary); }
        .card-body { padding: 15px; }
        .price { color: var(--gold); font-weight: 900; font-size: 18px; margin: 5px 0; }
        .btn { display: block; width: 100%; padding: 12px; text-align: center; border-radius: 8px; text-decoration: none; font-weight: 900; margin-top: 10px; cursor: pointer; border: none; text-transform: uppercase; box-sizing: border-box; font-size: 12px; }
        .btn-go { background: var(--primary); color: #000; }
        .btn-dl { background: var(--gold); color: #000; display: none; }
        .form-box { background: var(--card); padding: 15px; border-radius: 15px; border: 1px dashed var(--primary); }
        textarea, input { width: 100%; padding: 10px; margin-bottom: 12px; background: #000; border: 1px solid #333; color: var(--primary); border-radius: 8px; box-sizing: border-box; font-family: monospace; }
        .file-label { display: block; background: #111; padding: 10px; border-radius: 8px; border: 1px solid #333; text-align: center; font-size: 11px; cursor: pointer; color: var(--primary); margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="header"><h1>SHIKII MODS</h1></div>

    <div class="nav-tabs">
        <div class="tab active" onclick="switchTab('free', this)">🆓 GRATIS</div>
        <div class="tab" onclick="switchTab('premium', this)">💰 PREMIUM</div>
        <div class="tab" onclick="switchTab('obfus', this)">🔐 OBFUSCATOR</div>
        <div class="tab" onclick="switchTab('social', this)">📱 MEDSOS</div>
        <div class="tab" onclick="switchTab('admin', this)">🛠️ ADMIN</div>
    </div>

    <div id="free" class="container active"><div id="list-free"></div></div>
    <div id="premium" class="container"><div id="list-premium"></div></div>

    <div id="obfus" class="container">
        <div class="form-box">
            <h3 style="color:var(--primary); margin:0;">🔐 LUA OBFUSCATOR V3</h3>
            <p style="font-size:10px; color:#aaa; margin-bottom:15px;">Proteksi script lua lu biar ga di colong!</p>
            
            <label class="file-label" for="luaFile">📂 PILIH FILE .LUA</label>
            <input type="file" id="luaFile" accept=".lua" style="display:none;" onchange="handleLuaFile(this)">
            
            <textarea id="luaInput" rows="5" placeholder="Atau paste script LUA di sini..."></textarea>
            
            <button class="btn btn-go" onclick="obfuscateLua()">🔒 MULAI ENKRIPSI</button>
            
            <button id="dlBtn" class="btn btn-dl" onclick="downloadResult()">📥 DOWNLOAD HASIL</button>
            
            <div id="obfusStatus" style="text-align:center; font-size:10px; color:var(--primary); margin-top:10px;"></div>
        </div>
    </div>

    <div id="social" class="container">
        <div class="form-box" style="text-align: center;">
            <h3 style="color:var(--primary);">SOCIAL MEDIA</h3>
            <a href="https://youtube.com/@mlanz04?si=X2BqoWyDMRE1MyGy" target="_blank" class="btn btn-go" style="background:#ff0000; color:#fff;">📺 YOUTUBE</a>
            <a href="https://whatsapp.com/channel/0029Vb730uH8kyyTsZ7aO826" target="_blank" class="btn btn-go" style="background:#25d366; color:#fff;">📢 SALURAN WA</a>
        </div>
    </div>

    <div id="admin" class="container">
        <div class="form-box">
            <h3 style="color:var(--primary);">➕ UPLOAD MOD</h3>
            <input type="text" id="name" placeholder="Nama Mod">
            <input type="text" id="price" placeholder="Harga (Contoh: FREE / 10k)">
            <input type="file" id="imageFile" accept="image/*">
            <input type="text" id="url" placeholder="Link Download">
            <button class="btn btn-go" onclick="startUpload()">🚀 PUBLISH</button>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = "hamlanmaulana"; 
        const NOMOR_WA = "6281315151701"; 
        let obfuscatedContent = ""; // Simpan hasil enkripsi di sini

        const firebaseConfig = {
            apiKey: "AIzaSyBrcjH0HfMDAsjaFZkXodZJtEXegbD1R9w",
            authDomain: "shiki-mods.firebaseapp.com",
            projectId: "shiki-mods",
            databaseURL: "https://shiki-mods-default-rtdb.asia-southeast1.firebasedatabase.app",
            storageBucket: "shiki-mods.firebasestorage.app",
            appId: "1:407754298344:web:002f0c7033e59f9f9a0a5d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref("shiki_market_links");
        const storage = firebase.storage().ref();

        function switchTab(id, el) {
            if (id === 'admin' && prompt("PASSWORD ADMIN:") !== ADMIN_PASSWORD) return;
            document.querySelectorAll('.container').forEach(c => c.style.display = 'none');
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(id).style.display = 'block';
            el.classList.add('active');
        }

        function handleLuaFile(input) {
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = (e) => { document.getElementById("luaInput").value = e.target.result; };
            reader.readAsText(file);
        }

        function obfuscateLua() {
            const input = document.getElementById("luaInput").value;
            if(!input) return alert("Pilih file atau paste script dulu!");
            
            const status = document.getElementById("obfusStatus");
            const dlBtn = document.getElementById("dlBtn");
            
            status.innerText = "⏳ Sedang memproses...";
            dlBtn.style.display = "none";

            // Proses Enkripsi
            const bytes = [];
            for (let i = 0; i < input.length; i++) { bytes.push(input.charCodeAt(i) + 13); }
            obfuscatedContent = `--[ ENCRYPTED BY SHIKII ]--\nlocal _ = '${bytes.join(",")}'; load(function(s) local r = ''; for i in s:gmatch('%d+') do r = r .. string.char(tonumber(i)-13) end return r end(_))()`;

            setTimeout(() => {
                status.innerText = "✅ Berhasil Di-Enkripsi!";
                dlBtn.style.display = "block"; // Munculin tombol download
            }, 800);
        }

        function downloadResult() {
            if(!obfuscatedContent) return;
            const blob = new Blob([obfuscatedContent], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'SHIKII_PROTECTED.lua';
            a.click();
            window.URL.revokeObjectURL(url);
        }

        async function startUpload() {
            const name = document.getElementById("name").value;
            const price = document.getElementById("price").value;
            const imgFile = document.getElementById("imageFile").files[0];
            const url = document.getElementById("url").value;
            if(!name || !price) return alert("Isi data!");
            try {
                let imgUrl = "";
                if(imgFile) {
                    const snap = await storage.child('previews/'+Date.now()).put(imgFile);
                    imgUrl = await snap.ref.getDownloadURL();
                }
                await db.push().set({ name, price, img: imgUrl, url, time: Date.now() });
                alert("Berhasil!"); location.reload();
            } catch (e) { alert(e.message); }
        }

        db.on("value", (snap) => {
            const f = document.getElementById("list-free"); const p = document.getElementById("list-premium");
            f.innerHTML = ""; p.innerHTML = "";
            snap.forEach((child) => {
                const i = child.val();
                const isFree = i.price.toLowerCase().includes("free");
                const waText = `BANG SHIKI GUA MAU BUY ${i.name.toUpperCase()}`;
                const btnLink = isFree ? i.url : `https://wa.me/${NOMOR_WA}?text=${encodeURIComponent(waText)}`;
                
                const card = `
                <div class="item-card">
                    ${i.img ? `<img src="${i.img}" class="preview-img">` : ''}
                    <div class="card-body">
                        <div style="font-weight:900;">${i.name}</div>
                        <div class="price">${i.price}</div>
                        <a href="${btnLink}" target="_blank" class="btn btn-go">${isFree ? '🔗 AMBIL' : '💳 BELI'}</a>
                    </div>
                </div>`;
                if(isFree) f.innerHTML = card + f.innerHTML; else p.innerHTML = card + p.innerHTML;
            });
        });
    </script>
</body>
</html>
