<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHIKII MODS V36.0</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00d2ff; --accent: #9d50bb; --bg: #0b0e11; --card-bg: rgba(25, 30, 36, 0.95); --gold: #f1c40f; }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: #e1e1e1; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        /* UI HEADER */
        .header { text-align: center; padding: 25px 10px; }
        .header h1 { font-family: 'Orbitron', sans-serif; font-size: 24px; color: #fff; text-shadow: 0 0 10px var(--primary); margin: 0; }
        
        /* TABS */
        .nav-tabs { display: flex; overflow-x: auto; gap: 8px; padding: 10px; width: 100%; max-width: 500px; scrollbar-width: none; justify-content: center; }
        .tab { white-space: nowrap; padding: 8px 15px; background: #1a1f26; border-radius: 10px; border: 1px solid #333; font-size: 11px; font-weight: 600; cursor: pointer; color: #888; }
        .tab.active { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; border: none; box-shadow: 0 4px 12px rgba(0, 210, 255, 0.3); }

        .container { width: 100%; max-width: 450px; display: none; padding: 15px; animation: fadeIn 0.3s ease-in-out; }
        .container.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* GRID CARDS */
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .item-card { background: var(--card-bg); border-radius: 15px; border: 1px solid #222; overflow: hidden; position: relative; }
        .img-wrapper { position: relative; width: 100%; height: 110px; background: #000; }
        .preview-img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.7); }
        .img-label { position: absolute; bottom: 5px; left: 5px; background: var(--primary); color: #000; font-size: 8px; font-weight: 900; padding: 2px 6px; border-radius: 3px; text-transform: uppercase; }

        .card-info { padding: 10px; }
        .item-name { font-weight: 600; font-size: 12px; color: #fff; margin-bottom: 2px; }
        .item-price { font-size: 11px; color: var(--gold); font-weight: 700; }
        .btn-buy { margin-top: 8px; display: block; width: 100%; padding: 7px; border-radius: 6px; background: rgba(255,255,255,0.05); border: 1px solid #444; color: #fff; text-decoration: none; font-size: 9px; text-align: center; font-weight: 600; }

        /* FORMS (ADMIN & OBFUS) */
        .form-box { background: var(--card-bg); padding: 18px; border-radius: 15px; border: 1px solid #333; }
        .form-box h3 { margin-top: 0; font-size: 16px; color: var(--primary); font-family: 'Orbitron'; }
        
        input, textarea { width: 100%; background: #050505; border: 1px solid #222; border-radius: 8px; padding: 10px; color: #fff; margin-bottom: 10px; font-size: 12px; }
        .btn-main { width: 100%; padding: 12px; border-radius: 8px; border: none; background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; font-weight: 700; cursor: pointer; text-transform: uppercase; font-size: 11px; }
        
        .file-input-label { display: block; background: #111; border: 1px dashed var(--primary); padding: 10px; text-align: center; border-radius: 8px; color: var(--primary); font-size: 11px; cursor: pointer; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>SHIKII MARKET</h1>
    </div>

    <div class="nav-tabs">
        <div class="tab active" onclick="switchTab('free', this)">FREE</div>
        <div class="tab" onclick="switchTab('premium', this)">PREMIUM</div>
        <div class="tab" onclick="switchTab('obfus', this)">OBFUSCATOR</div>
        <div class="tab" onclick="switchTab('admin', this)">ADMIN</div>
    </div>

    <div id="free" class="container active"><div id="list-free" class="grid-container"></div></div>
    <div id="premium" class="container"><div id="list-premium" class="grid-container"></div></div>

    <div id="obfus" class="container">
        <div class="form-box">
            <h3>LUA PROTECTOR</h3>
            <label class="file-input-label" for="luaFile">📂 KLIK UNTUK UPLOAD FILE .LUA</label>
            <input type="file" id="luaFile" accept=".lua" style="display:none;" onchange="handleLuaUpload(this)">
            
            <textarea id="luaInput" rows="6" placeholder="Atau paste script di sini..."></textarea>
            
            <button class="btn-main" onclick="runObfus()">PROTECT SCRIPT</button>
            <button id="dlBtn" class="btn-main" style="display:none; margin-top:10px; background:var(--gold); color:#000;" onclick="downloadResult()">📥 DOWNLOAD FILE</button>
        </div>
    </div>

    <div id="admin" class="container">
        <div class="form-box">
            <h3>UPLOAD CONTENT</h3>
            <input type="text" id="name" placeholder="Nama Mod (Contoh: Reborn Mod)">
            <input type="text" id="label" placeholder="Label di Foto (Contoh: VIP ONLY)">
            <input type="text" id="price" placeholder="Harga (Contoh: FREE atau 15k)">
            <input type="text" id="url" placeholder="Link Download">
            
            <label class="file-input-label" for="imgInput">🖼️ PILIH FOTO PREVIEW</label>
            <input type="file" id="imgInput" accept="image/*" style="display:none;">
            
            <button class="btn-main" onclick="uploadMod()">🚀 PUBLISH SEKARANG</button>
            <div id="upStatus" style="font-size:10px; text-align:center; margin-top:5px;"></div>
        </div>
    </div>

    <script>
        const config = {
            apiKey: "AIzaSyBrcjH0HfMDAsjaFZkXodZJtEXegbD1R9w",
            authDomain: "shiki-mods.firebaseapp.com",
            projectId: "shiki-mods",
            databaseURL: "https://shiki-mods-default-rtdb.asia-southeast1.firebasedatabase.app",
            storageBucket: "shiki-mods.firebasestorage.app",
            appId: "1:407754298344:web:002f0c7033e59f9f9a0a5d"
        };
        firebase.initializeApp(config);
        const db = firebase.database().ref("shiki_market_links");
        const storage = firebase.storage().ref();

        let obfusResult = "";

        function switchTab(id, el) {
            if (id === 'admin' && prompt("PASS ADMIN:") !== "hamlanmaulana") return;
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        }

        // --- OBFUSCATOR LOGIC ---
        function handleLuaUpload(input) {
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = (e) => { document.getElementById("luaInput").value = e.target.result; };
            reader.readAsText(file);
        }

        function runObfus() {
            const input = document.getElementById("luaInput").value;
            if(!input) return alert("Kosong puki!");
            const bytes = [];
            for (let i = 0; i < input.length; i++) { bytes.push(input.charCodeAt(i) + 13); }
            obfusResult = `--[ PROTECTED BY SHIKII ]--\nlocal _ = '${bytes.join(",")}'; load(function(s) local r = ''; for i in s:gmatch('%d+') do r = r .. string.char(tonumber(i)-13) end return r end(_))()`;
            document.getElementById("dlBtn").style.display = "block";
            alert("Berhasil di-protect!");
        }

        function downloadResult() {
            const blob = new Blob([obfusResult], {type: 'text/plain'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'shikii_protected.lua';
            a.click();
        }

        // --- ADMIN LOGIC ---
        async function uploadMod() {
            const name = document.getElementById("name").value;
            const label = document.getElementById("label").value;
            const price = document.getElementById("price").value;
            const url = document.getElementById("url").value;
            const file = document.getElementById("imgInput").files[0];
            const status = document.getElementById("upStatus");

            if(!name || !file) return alert("Minimal Nama & Foto diisi!");

            status.innerText = "⏳ Uploading... Sabar nyet!";
            try {
                const s = await storage.child('market/'+Date.now()).put(file);
                const imgUrl = await s.ref.getDownloadURL();
                await db.push().set({ name, label, price, url, img: imgUrl });
                status.innerText = "✅ Sukses Terbit!";
                setTimeout(() => location.reload(), 1000);
            } catch(e) { alert(e.message); }
        }

        // --- FETCH DATA ---
        db.on("value", (snap) => {
            const f = document.getElementById("list-free");
            const p = document.getElementById("list-premium");
            f.innerHTML = ""; p.innerHTML = "";
            snap.forEach(c => {
                const i = c.val();
                const isFree = i.price.toLowerCase().includes("free");
                const card = `
                    <div class="item-card">
                        <div class="img-wrapper">
                            <img src="${i.img}" class="preview-img">
                            ${i.label ? `<div class="img-label">${i.label}</div>` : ''}
                        </div>
                        <div class="card-info">
                            <div class="item-name">${i.name}</div>
                            <div class="item-price">${i.price}</div>
                            <a href="${isFree ? i.url : 'https://wa.me/6281315151701?text=BUY%20'+encodeURIComponent(i.name)}" class="btn-buy">${isFree ? 'DOWNLOAD' : 'BUY NOW'}</a>
                        </div>
                    </div>`;
                if(isFree) f.innerHTML += card; else p.innerHTML += card;
            });
        });
    </script>
</body>
</html>
