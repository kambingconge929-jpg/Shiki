<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHIKI MODS | Purple Elite</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --primary: #bc13fe; --bg: #0a0510; --card: rgba(25, 10, 40, 0.9); --text: #f0e6ff; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Poppins', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; background: radial-gradient(circle at center, #2e0044 0%, #0a0510 100%); padding: 40px 10px; overflow-x: hidden; }
        .container, .section { background: var(--card); backdrop-filter: blur(10px); border-radius: 20px; border: 1px solid var(--primary); width: 95%; max-width: 420px; padding: 25px; text-align: center; margin-bottom: 20px; box-sizing: border-box; box-shadow: 0 0 20px rgba(188, 19, 254, 0.2); }
        .profile-img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--primary); box-shadow: 0 0 15px var(--primary); margin-bottom: 15px; }
        h1 { color: var(--primary); text-shadow: 0 0 10px var(--primary); margin: 0; font-size: 24px; }
        .links { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .btn { background: rgba(188, 19, 254, 0.1); color: white; padding: 12px; text-decoration: none; border-radius: 10px; border: 1px solid var(--primary); font-weight: bold; transition: 0.3s; font-size: 13px; }
        .btn:hover { background: var(--primary); color: #fff; box-shadow: 0 0 15px var(--primary); }

        /* CMD Console Style */
        .cmd-box { background: #000; border: 1px solid #444; border-radius: 8px; padding: 10px; text-align: left; font-family: 'Courier New', monospace; font-size: 11px; color: #00ff00; height: 100px; overflow-y: auto; margin: 15px 0; }
        
        /* Obfuscator Section */
        .obf-area { background: rgba(0,0,0,0.3); border-radius: 10px; padding: 15px; margin-top: 10px; }
        textarea { width: 100%; background: #111; border: 1px solid var(--primary); border-radius: 8px; padding: 10px; color: #fff; font-size: 12px; resize: none; margin-bottom: 10px; box-sizing: border-box; }

        /* Grid */
        #project-grid { width: 95%; max-width: 420px; display: flex; flex-direction: column; gap: 15px; }
        .card { background: var(--card); border-radius: 15px; border: 1px solid #444; padding: 15px; text-align: left; animation: slideIn 0.4s; }
        .card-title { font-weight: bold; color: var(--primary); margin-bottom: 5px; }
        .btn-dl { background: var(--primary); color: #fff; padding: 8px; border-radius: 8px; text-decoration: none; display: block; text-align: center; margin-top: 10px; font-size: 12px; font-weight: bold; }

        input[type="file"] { margin-bottom: 10px; font-size: 12px; color: var(--primary); }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://cdn.discordapp.com/attachments/1403306022361235466/1501407305051275285/file_00000000bd78720bb6afdf59771ac3c3.png?ex=69fbf604&is=69faa484&hm=1117233214580a7992f48e3edbb75da66b08f6dcc3a3e8408ed64775d30bb169&" class="profile-img">
        <h1>SHIKI MODS</h1>
        <p style="font-size:11px; color:#ccc;">Verified Android Modder | Lua Developer</p>
        
        <div class="cmd-box" id="cmdOut">
            > System ShikiMods V6.0 Loaded...<br>
            > Waiting for command...
        </div>

        <div class="links">
            <a href="https://wa.me/6281315151701" class="btn">💬 Personal WhatsApp</a>
            <a href="https://whatsapp.com/channel/0029Vb730uH8kyyTsZ7aO826" class="btn">📢 Saluran WhatsApp</a>
            <a href="https://youtube.com/@mlanz04?si=KEOeEpFZAkD92HgE" class="btn">📺 YouTube Official</a>
        </div>
    </div>

    <div class="section">
        <div style="color:var(--primary); font-weight:bold; margin-bottom:15px;">🛠️ LUA OBFUSCATOR</div>
        <textarea id="obfInput" rows="4" placeholder="Paste Kode Lua Lu..."></textarea>
        <button class="btn" onclick="obfuscateCode()" style="width:100%;">Encrypted Now!</button>
    </div>

    <div class="section">
        <div style="color:var(--primary); font-weight:bold; margin-bottom:15px;">📤 UPLOAD PROJECT (.LUA)</div>
        <input type="text" id="scriptName" placeholder="Judul Script..." style="width:100%; background:#111; border:1px solid var(--primary); padding:10px; border-radius:8px; color:#fff; margin-bottom:10px; box-sizing:border-box;">
        <input type="file" id="fileInput" accept=".lua">
        <button class="btn" onclick="uploadFile()" style="width:100%; background:var(--primary); color:#000;">🚀 Upload to Store</button>
    </div>

    <div id="project-grid"></div>

    <script>
        const firebaseConfig = { databaseURL: "https://shikimods-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref("scripts");

        function logCMD(msg) {
            const out = document.getElementById("cmdOut");
            out.innerHTML += `<br>> ${msg}`;
            out.scrollTop = out.scrollHeight;
        }

        // FUNGSI OBFUSCATOR SEDERHANA (HEX)
        function obfuscateCode() {
            const input = document.getElementById("obfInput").value;
            if(!input) return alert("Puki, isi kodenya!");
            let result = "-- SHIKI OBFUSCATOR --\n";
            result += "load(string.char(" + input.split('').map(c => c.charCodeAt(0)).join(',') + "))()";
            document.getElementById("obfInput").value = result;
            logCMD("Code Obfuscated successfully!");
        }

        // FUNGSI UPLOAD PAKE FILE
        function uploadFile() {
            const name = document.getElementById("scriptName").value;
            const file = document.getElementById("fileInput").files[0];
            if(!name || !file) return alert("Pilih file & isi nama, anjing!");

            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                db.push().set({ name: name, code: content, date: new Date().toLocaleDateString() });
                logCMD(`Uploaded: ${name}.lua`);
                alert("Berhasil Upload, mek!");
            };
            reader.readAsText(file);
        }

        db.on("value", (snap) => {
            const grid = document.getElementById("project-grid");
            grid.innerHTML = "";
            snap.forEach((child) => {
                const data = child.val();
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `<div class="card-title">${data.name}</div>
                    <div style="font-size:10px; color:#888;">${data.date}</div>
                    <a href="data:text/plain;charset=utf-8,${encodeURIComponent(data.code)}" download="${data.name}.lua" class="btn-dl">DOWNLOAD SCRIPT</a>`;
                grid.prepend(card);
            });
        });
    </script>
</body>
</html>
