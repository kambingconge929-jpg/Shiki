<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHIKI HUB | V1.0 FINAL</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #bc13fe; --bg: #050208; --card: rgba(20, 10, 30, 0.9); --gold: #ffd700; }
        body { background: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; margin: 0; padding: 20px 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header h1 { font-family: 'Orbitron', sans-serif; font-size: 28px; color: var(--primary); text-shadow: 0 0 15px var(--primary); margin: 0; text-align: center; }
        .nav-tabs { display: flex; gap: 10px; margin: 20px 0; width: 100%; max-width: 450px; }
        .tab { flex: 1; padding: 12px; text-align: center; background: var(--card); border-radius: 10px; cursor: pointer; font-weight: bold; border: 1px solid #333; transition: 0.3s; }
        .tab.active { background: var(--primary); color: #000; border-color: var(--primary); box-shadow: 0 0 10px var(--primary); }
        .container { width: 100%; max-width: 450px; display: none; }
        .container.active { display: block; }
        .item-card { background: var(--card); border-radius: 15px; border-left: 5px solid var(--primary); padding: 18px; margin-bottom: 15px; border-top: 1px solid #222; }
        .price { color: var(--gold); font-weight: 900; margin: 5px 0; }
        .btn-action { display: block; width: 100%; padding: 12px; text-align: center; border-radius: 8px; text-decoration: none; font-weight: 900; margin-top: 10px; border: none; cursor: pointer; text-transform: uppercase; }
        .btn-free { background: var(--primary); color: #000; }
        .btn-buy { background: #fff; color: #000; }
        .form-box { background: var(--card); padding: 20px; border-radius: 15px; border: 1px dashed var(--primary); }
        input, select { width: 100%; padding: 12px; margin-bottom: 12px; background: #111; border: 1px solid #333; color: #fff; border-radius: 8px; box-sizing: border-box; }
        .progress-bar { width: 100%; background: #222; border-radius: 10px; height: 12px; margin: 10px 0; display: none; overflow: hidden; }
        #pFill { height: 100%; background: linear-gradient(90deg, var(--primary), #fff); width: 0%; transition: 0.2s; }
        .log { background: #000; color: #0f0; font-family: monospace; font-size: 10px; padding: 10px; border-radius: 5px; height: 50px; overflow-y: auto; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="header"><h1>SHIKI HUB V16</h1></div>

    <div class="nav-tabs">
        <div class="tab active" onclick="switchTab('store', this)">🛒 STORE</div>
        <div class="tab" onclick="switchTab('admin', this)">🛡️ SELLER</div>
    </div>

    <div id="store" class="container active">
        <div id="item-list"></div>
    </div>

    <div id="admin" class="container">
        <div class="log" id="logBox">> Shiki Engine v16 Ready...</div>
        <div class="form-box">
            <h3 style="color:var(--primary); margin:0 0 15px 0;">📤 UPLOAD PROJECT (MAX 500MB)</h3>
            <input type="text" id="itemName" placeholder="Nama Script/Mod">
            <input type="number" id="itemPrice" placeholder="Harga (0 = Gratis)">
            <select id="itemCategory">
                <option value="free">FREE DOWNLOAD</option>
                <option value="paid">PREMIUM (PAID)</option>
            </select>
            <input type="file" id="fileInput">
            <div class="progress-bar" id="pBar"><div id="pFill"></div></div>
            <button class="btn-action btn-free" id="upBtn" onclick="uploadProcess()">🚀 PUBLISH TO HUB</button>
        </div>
    </div>

    <script>
        // CONFIG TERBARU DARI LU MEK!
        const firebaseConfig = {
            apiKey: "AIzaSyBrcjH0HfMDAsjaFZkXodZJtEXegbD1R9w",
            authDomain: "shiki-mods.firebaseapp.com",
            projectId: "shiki-mods",
            storageBucket: "shiki-mods.firebasestorage.app", // UPDATED!
            messagingSenderId: "407754298344",
            appId: "1:407754298344:web:9ea763e4052849829a0a5d",
            measurementId: "G-N87DKRBNPW"
        };
        
        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        const db = firebase.database().ref("shiki_v16_market");
        const storage = firebase.storage().ref("files_v16");

        function switchTab(id, el) {
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        }

        function log(msg) {
            const lb = document.getElementById("logBox");
            lb.innerHTML += `<br>> ${msg}`;
            lb.scrollTop = lb.scrollHeight;
        }

        function uploadProcess() {
            const name = document.getElementById("itemName").value;
            const price = document.getElementById("itemPrice").value;
            const cat = document.getElementById("itemCategory").value;
            const file = document.getElementById("fileInput").files[0];
            const btn = document.getElementById("upBtn");
            const pBar = document.getElementById("pBar");
            const pFill = document.getElementById("pFill");

            if(!name || !file) return alert("Puki ayam, isi dulu!");
            if(file.size > 500 * 1024 * 1024) return alert("Limit 500MB!");

            btn.disabled = true;
            pBar.style.display = "block";
            log("Starting upload: " + file.name);

            const fileRef = storage.child(Date.now() + "_" + file.name);
            const task = fileRef.put(file);

            task.on('state_changed', 
                (snap) => {
                    let prog = (snap.bytesTransferred / snap.totalBytes) * 100;
                    pFill.style.width = prog + "%";
                    log("Uploading: " + Math.round(prog) + "%");
                },
                (err) => {
                    log("Error: " + err.message);
                    alert("Gagal! Cek Rules Storage lu.");
                    btn.disabled = false;
                },
                () => {
                    task.snapshot.ref.getDownloadURL().then((url) => {
                        db.push().set({
                            name: name,
                            price: price == 0 ? "FREE" : "Rp " + parseInt(price).toLocaleString(),
                            category: cat,
                            fileUrl: url,
                            fileName: file.name,
                            timestamp: Date.now()
                        }).then(() => {
                            alert("Publish Berhasil!");
                            location.reload();
                        });
                    });
                }
            );
        }

        // LOAD DATA STORE
        db.on("value", (snap) => {
            const list = document.getElementById("item-list");
            list.innerHTML = "";
            if(!snap.exists()) list.innerHTML = "<p style='text-align:center; opacity:0.5;'>Market Kosong...</p>";

            snap.forEach((child) => {
                const item = child.val();
                const isPaid = item.category === "paid";
                
                const action = isPaid 
                    ? `<a href="https://wa.me/6281315151701?text=Beli+${encodeURIComponent(item.name)}+(${item.price})" class="btn-action btn-buy">🛒 BUY NOW</a>`
                    : `<a href="${item.fileUrl}" download="${item.fileName}" class="btn-action btn-free">⬇️ DOWNLOAD</a>`;

                const card = document.createElement("div");
                card.className = "item-card";
                card.innerHTML = `
                    <div style="font-weight:900; font-size:18px;">${item.name}</div>
                    <div class="price">${item.price}</div>
                    ${action}
                `;
                list.prepend(card);
            });
            log("Store synchronized.");
        });
    </script>
</body>
</html>
