<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHIKI MODS | Ultimate Elite</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --primary: #bc13fe; --bg: #0a0510; --card: rgba(25, 10, 40, 0.95); --text: #f0e6ff; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Poppins', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; background: radial-gradient(circle at center, #2e0044 0%, #0a0510 100%); padding: 40px 10px; min-height: 100vh; overflow-x: hidden; }
        .container, .section { background: var(--card); backdrop-filter: blur(15px); border-radius: 20px; border: 1px solid var(--primary); width: 95%; max-width: 420px; padding: 25px; text-align: center; margin-bottom: 20px; box-sizing: border-box; box-shadow: 0 0 25px rgba(188, 19, 254, 0.3); }
        .profile-img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--primary); box-shadow: 0 0 15px var(--primary); margin-bottom: 15px; }
        h1 { color: var(--primary); text-shadow: 0 0 10px var(--primary); margin: 0; font-size: 24px; letter-spacing: 2px; }
        .links { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .btn { background: rgba(188, 19, 254, 0.1); color: white; padding: 12px; text-decoration: none; border-radius: 10px; border: 1px solid var(--primary); font-weight: bold; transition: 0.3s; font-size: 13px; cursor: pointer; display: block; width: 100%; box-sizing: border-box; }
        .btn:hover { background: var(--primary); color: #fff; box-shadow: 0 0 15px var(--primary); transform: scale(1.02); }
        .cmd-box { background: #000; border: 1px solid #444; border-radius: 8px; padding: 10px; text-align: left; font-family: 'Courier New', monospace; font-size: 11px; color: #00ff00; height: 100px; overflow-y: auto; margin: 15px 0; border-left: 3px solid var(--primary); }
        textarea, input { width: 100%; background: #111; border: 1px solid var(--primary); border-radius: 8px; padding: 10px; color: #fff; font-size: 12px; margin-bottom: 10px; box-sizing: border-box; }
        .label { display: block; text-align: left; font-size: 11px; color: var(--primary); margin-bottom: 5px; font-weight: bold; text-transform: uppercase; }
        
        .store-header { width: 95%; max-width: 420px; text-align: center; background: var(--primary); color: #000; font-weight: 900; padding: 15px; border-radius: 10px; margin-bottom: 5px; text-shadow: 0 0 5px #fff; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; }
        #project-grid { width: 95%; max-width: 420px; display: none; flex-direction: column; gap: 12px; margin-top: 15px; }
        .card { background: rgba(188, 19, 254, 0.1); border-radius: 15px; border: 1px solid var(--primary); padding: 15px; text-align: left; animation: slideIn 0.4s; }
        .btn-dl { background: var(--primary); color: #000; padding: 8px; border-radius: 8px; text-decoration: none; display: block; text-align: center; margin-top: 10px; font-size: 12px; font-weight: bold; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://cdn.discordapp.com/attachments/1403306022361235466/1501407305051275285/file_00000000bd78720bb6afdf59771ac3c3.png?ex=69fbf604&is=69faa484&hm=1117233214580a7992f48e3edbb75da66b08f6dcc3a3e8408ed64775d30bb169&" class="profile-img">
        <h1>SHIKI MODS</h1>
        <div class="cmd-box" id="cmdOut">> KALO MAU KUNCI FILE ATAU UPLOAD MONETLOADER DI BAWAH</div>
        <div class="links">
            <a href="https://wa.me/6281315151701" class="btn">💬 ORDER JASA SHIKI</a>
            <a href="https://whatsapp.com/channel/0029Vb730uH8kyyTsZ7aO826" class="btn">📢 Saluran Shiki</a>
            <a href="https://youtube.com/@mlanz04?si=FHUJ1THdTdPX0lUU" class="btn">📺 YouTube Official Shiki</a>
        </div>
    </div>

    <div class="store-header" onclick="toggleStore()">
        📁 KUMPULAN MONETLOADER SHIKI <span id="arrow">▼</span>
    </div>
    <div id="project-grid"></div>

    <div class="section">
        <div style="color:var(--primary); font-weight:bold; margin-bottom:15px;">🔒 LUA OBFUSCATOR V2</div>
        <input type="file" id="obfFile" accept=".lua">
        <textarea id="obfInput" rows="3" placeholder="Kode akan muncul di sini..."></textarea>
        <button class="btn" onclick="obfuscateCode()" style="background:var(--primary); color:#000;">ENCRYPT & DOWNLOAD</button>
    </div>

    <div class="section" style="border-style: dashed;">
        <div style="color:var(--primary); font-weight:bold; margin-bottom:15px;">📤 UPLOAD KE STORE</div>
        <input type="text" id="scriptName" placeholder="Nama Script...">
        <input type="file" id="fileInput" accept=".lua">
        <button class="btn" onclick="uploadFile()" style="background:var(--primary); color:#000;">🚀 UPLOAD SEKARANG</button>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://shikimods-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref("scripts");

        function logCMD(msg) {
            const out = document.getElementById("cmdOut");
            out.innerHTML += `<br>> ${msg}`;
            out.scrollTop = out.scrollHeight;
        }

        // FUNGSI OBFUSCATOR
        document.getElementById('obfFile').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function(e) { document.getElementById('obfInput').value = e.target.result; };
            reader.readAsText(e.target.files[0]);
        });

        function obfuscateCode() {
            const input = document.getElementById("obfInput").value;
            if(!input) return alert("Isi kodenya puki!");
            const b64 = btoa(unescape(encodeURIComponent(input)));
            const result = `-- [[ SHIKI ELITE OBF ]] --\nlocal s = "${b64}"\nlocal function d(data) local b='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/' data = string.gsub(data, '[^'..b..'=]', '') return (data:gsub('.', function(x) if (x == '=') then return '' end local r,f='', (b:find(x)-1) for i=6,1,-1 do f=f..(r%2^i-r%2^(i-1)>0 and '1' or '0') end return f end):gsub('%d%d%d%d%d%d%d%d', function(x) local c=0 for i=1,8 do c=c+(x:sub(i,i)=='1' and 2^(8-i) or 0) end return string.char(c) end)) end\nload(d(s))()`;
            const blob = new Blob([result], {type: 'text/plain'});
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = "Shiki_Encrypted.lua"; a.click();
            logCMD("Obfuscated & Downloaded.");
        }

        // FUNGSI TOGGLE
        function toggleStore() {
            const grid = document.getElementById("project-grid");
            const arrow = document.getElementById("arrow");
            if (grid.style.display === "flex") {
                grid.style.display = "none";
                arrow.innerHTML = "▼";
                logCMD("Folder Closed.");
            } else {
                grid.style.display = "flex";
                arrow.innerHTML = "▲";
                logCMD("Folder Opened.");
            }
        }

        // FUNGSI UPLOAD
        function uploadFile() {
            const name = document.getElementById("scriptName").value;
            const file = document.getElementById("fileInput").files[0];
            if(!name || !file) return alert("Lengkapin datanya!");
            const reader = new FileReader();
            reader.onload = function(e) {
                db.push().set({ name: name, code: e.target.result, date: new Date().toLocaleDateString() });
                alert("Berhasil Masuk Store!");
                logCMD("Uploaded: " + name);
            };
            reader.readAsText(file);
        }

        // FETCH DATA
        db.on("value", (snap) => {
            const grid = document.getElementById("project-grid");
            grid.innerHTML = "";
            snap.forEach((child) => {
                const data = child.val();
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `<div style="font-weight:bold; color:#fff;">${data.name}</div>
                    <div style="font-size:10px; color:var(--primary);">${data.date}</div>
                    <a href="data:text/plain;charset=utf-8,${encodeURIComponent(data.code)}" download="${data.name}.lua" class="btn-dl">DOWNLOAD LUA</a>`;
                grid.prepend(card);
            });
        });
    </script>
</body>
</html>
