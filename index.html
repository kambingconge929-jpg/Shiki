<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHIKI MARKET V33.0</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00ff88; --bg: #050208; --card: rgba(15, 15, 25, 0.95); --gold: #ffd700; }
        body { background: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .header h1 { font-family: 'Orbitron', sans-serif; font-size: 24px; color: var(--primary); text-shadow: 0 0 10px var(--primary); margin: 20px 0; }
        .nav-tabs { display: flex; gap: 5px; margin-bottom: 20px; width: 100%; max-width: 400px; }
        .tab { flex: 1; padding: 12px 5px; text-align: center; background: #111; border-radius: 8px; cursor: pointer; border: 1px solid #333; font-weight: bold; font-size: 11px; }
        .tab.active { background: var(--primary); color: #000; box-shadow: 0 0 10px var(--primary); }
        .container { width: 100%; max-width: 400px; display: none; }
        .container.active { display: block; }
        .item-card { background: var(--card); border-radius: 15px; padding: 15px; margin-bottom: 15px; border: 1px solid #222; }
        .preview-img { width: 100%; height: auto; border-radius: 10px; margin-bottom: 10px; border: 1px solid var(--primary); }
        .price { color: var(--gold); font-weight: 900; font-size: 18px; }
        .btn { display: block; width: 100%; padding: 12px; text-align: center; border-radius: 8px; text-decoration: none; font-weight: 900; margin-top: 10px; background: var(--primary); color: #000; }
        .form-box { background: var(--card); padding: 15px; border-radius: 15px; border: 1px dashed var(--primary); }
        input { width: 100%; padding: 10px; margin-bottom: 12px; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="header"><h1>SHIKII MODS</h1></div>

    <div class="nav-tabs">
        <div class="tab active" onclick="buka('store', this)">🛒 MARKET</div>
        <div class="tab" onclick="buka('social', this)">📱 SALURAN</div>
        <div class="tab" onclick="buka('admin', this)">🛠️ ADMIN</div>
    </div>

    <div id="store" class="container active"><div id="list"></div></div>

    <div id="social" class="container">
        <div class="form-box" style="text-align: center;">
            <h3 style="color:var(--primary);">SOCIAL MEDIA</h3>
            <a href="http://googleusercontent.com/youtube.com/1" target="_blank" class="btn" style="background:red;color:white;">YOUTUBE</a>
            <a href="https://whatsapp.com/channel/0029Vb730uH8kyyTsZ7aO826" target="_blank" class="btn" style="background:#25d366;color:white;">WHATSAPP</a>
        </div>
    </div>

    <div id="admin" class="container">
        <div class="form-box">
            <h3>UPLOAD MOD</h3>
            <input type="text" id="n" placeholder="Nama Mod">
            <input type="text" id="p" placeholder="Harga (20k / FREE)">
            <input type="text" id="i" placeholder="Link Foto Preview (Opsional)">
            <input type="text" id="u" placeholder="Link Download">
            <button class="btn" onclick="kirim()">PUBLISH MEK</button>
        </div>
    </div>

    <script>
        const config = {
            apiKey: "AIzaSyBrcjH0HfMDAsjaFZkXodZJtEXegbD1R9w",
            authDomain: "shiki-mods.firebaseapp.com",
            projectId: "shiki-mods",
            databaseURL: "https://shiki-mods-default-rtdb.asia-southeast1.firebasedatabase.app",
        };
        firebase.initializeApp(config);
        const db = firebase.database().ref("shiki_market_links");

        function buka(id, el) {
            if(id === 'admin' && prompt("PASS:") !== "hamlanmaulana") return;
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        }

        function kirim() {
            const n = document.getElementById("n").value;
            const p = document.getElementById("p").value;
            const i = document.getElementById("i").value;
            const u = document.getElementById("u").value;
            if(!n || !p) return alert("Isi puki!");
            db.push().set({ name: n, price: p, img: i, url: u }).then(() => location.reload());
        }

        db.on("value", (s) => {
            const l = document.getElementById("list");
            l.innerHTML = "";
            s.forEach((c) => {
                const v = c.val();
                l.innerHTML = `
                <div class="item-card">
                    ${v.img ? `<img src="${v.img}" class="preview-img">` : ''}
                    <b>${v.name}</b><br>
                    <span class="price">${v.price}</span>
                    <a href="${v.price.toLowerCase().includes('free') ? v.url : 'https://wa.me/6281315151701'}" class="btn">GAS AMBIL</a>
                </div>` + l.innerHTML;
            });
        });
    </script>
</body>
</html>
